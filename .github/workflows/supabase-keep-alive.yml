name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Keep Supabase database active
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "VITE_SUPABASE_URL is not configured"
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "VITE_SUPABASE_ANON_KEY is not configured"
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL//$'\r'/}"
          SUPABASE_URL="${SUPABASE_URL#"${SUPABASE_URL%%[![:space:]]*}"}"
          SUPABASE_URL="${SUPABASE_URL%"${SUPABASE_URL##*[![:space:]]}"}"
          SUPABASE_URL="${SUPABASE_URL%/}"

          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY//$'\r'/}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY#"${SUPABASE_ANON_KEY%%[![:space:]]*}"}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY%"${SUPABASE_ANON_KEY##*[![:space:]]}"}"

          if ! [[ "$SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]; then
            echo "VITE_SUPABASE_URL must look like https://<project-ref>.supabase.co (check GitHub secret for typos)"
            exit 1
          fi

          url_ref="${SUPABASE_URL#https://}"
          url_ref="${url_ref%%.supabase.co}"

          jwt_payload="$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/')"
          case $(( ${#jwt_payload} % 4 )) in
            2) jwt_payload="${jwt_payload}==" ;;
            3) jwt_payload="${jwt_payload}=" ;;
          esac
          key_ref="$(printf '%s' "$jwt_payload" | base64 -d 2>/dev/null | sed -n 's/.*"ref"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

          if [ -z "$key_ref" ] || [ "$url_ref" != "$key_ref" ]; then
            echo "VITE_SUPABASE_URL project ref does not match VITE_SUPABASE_ANON_KEY (update both GitHub secrets from Supabase Dashboard → Settings → API)"
            exit 1
          fi

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}') || {
            echo "keep_alive RPC request failed (HTTP 4xx/5xx). Common causes: wrong GitHub secrets, or migration not applied on this project."
            exit 1
          }

          echo "Supabase keep-alive request completed successfully."

          if [ -n "$RESPONSE" ]; then
            echo "Database RPC returned a response."
          fi
