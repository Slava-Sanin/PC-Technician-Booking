name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Keep Supabase database active
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL is not configured"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY is not configured"
            exit 1
          fi

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data '{}')

          echo "Supabase keep-alive request completed successfully."

          if [ -n "$RESPONSE" ]; then
            echo "Database RPC returned a response."
          fi
